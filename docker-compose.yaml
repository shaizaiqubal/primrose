x-app-environment: &app-environment
  DATABASE_URL: "postgresql+psycopg://primroses1:password@postgres:5432/primroses1"
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION_NAME: document_vectors
  REDIS_PORT: "6379"
  JWT_SECRET_FILE: /var/lib/primrose/jwt_secret

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *app-environment
      REDIS_HOST: cache
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_started
      # init_schema:
      #   condition: service_completed_successfully
    volumes:
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - app_data:/var/lib/primrose

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: primroses1
      POSTGRES_USER: primroses1
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U primroses1 -d primroses1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # init_schema:
  #   build: .
  #   command: python -m backend.init_schema
  #   environment:
  #     DATABASE_URL: ${DATABASE_URL}
  #   depends_on:
  #     postgres:
  #       condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      - api

  cache:
    image: redis
    ports:
      - "6379:6379"
    volumes:
      - cache_data:/data

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      <<: *app-environment
      REDIS_HOST: cache
      QDRANT_URL: http://qdrant:6333
    volumes:
      - app_data:/var/lib/primrose
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_started
      qdrant:
        condition: service_started

  entity-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: python -m backend.services.entity_worker
    env_file:
      - .env
    environment:
      <<: *app-environment
      REDIS_HOST: cache
    volumes:
      - app_data:/var/lib/primrose
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_started
      qdrant:
        condition: service_started

  topic-naming-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: python -m backend.services.topic_naming_worker
    env_file:
      - .env
    environment:
      <<: *app-environment
      REDIS_HOST: cache
    volumes:
      - app_data:/var/lib/primrose
    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_started
      qdrant:
        condition: service_started
volumes:
  postgres_data:
  qdrant_data:
  frontend_node_modules:
  cache_data:
  app_data:
