name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-repo
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install-requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start test Docker services
        run: docker compose --env-file .env.test -f docker-compose.test.yml up -d --build

      - name: Run tests
        run: docker compose --env-file .env.test -f docker-compose.test.yml exec -T api-test python -m pytest
      
      - name: Stop test Docker services
        if: always()
        run: docker compose --env-file .env.test -f docker-compose.test.yml down -v
